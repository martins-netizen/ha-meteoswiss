version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Keep both reviewed HA/fixture pins in the .in manifests unchanged.
  # A generated Python PR still needs the universal-lock verification in CI.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    groups:
      python-ci:
        applies-to: version-updates
        patterns: ["*"]
      python-ci-security:
        applies-to: security-updates
        patterns: ["*"]
