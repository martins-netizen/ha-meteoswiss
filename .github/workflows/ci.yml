name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Test dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_OFFLINE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          check-latest: true
      - name: Check Python and pip before installing the parser
        run: python scripts/check_ci_security.py bootstrap
      - name: Install only the existing hash-pinned compiler and parser
        run: |
          python scripts/check_test_lockfiles.py compiler > "$RUNNER_TEMP/meteoswiss-audit-parser.txt"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/meteoswiss-audit-parser.txt"
      - name: Check every package version in both universal locks
        run: python -m scripts.check_dependency_advisories --output "$RUNNER_TEMP/meteoswiss-dependency-audit.json"

  lockfiles:
    name: Universal test locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          check-latest: true
      - name: Check Python and pip before installing the compiler
        run: python scripts/check_ci_security.py bootstrap
      - name: Install only the hash-pinned lock compiler and parser
        run: |
          python scripts/check_test_lockfiles.py compiler > "$RUNNER_TEMP/meteoswiss-lock-compiler.txt"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/meteoswiss-lock-compiler.txt"
      # Network resolution happens only in this separate maintenance job.
      # Both HA compatibility jobs keep UV_OFFLINE=true throughout.
      - name: Verify both universal locks without changing the checkout
        run: python scripts/check_test_lockfiles.py verify

  compatibility:
    name: HA ${{ matrix.ha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.11.0'
            requirements: requirements_test_min.txt
          - ha: '2026.11.1'
            requirements: requirements_test.txt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Preserve HA's uv dependency pins without allowing uv network access.
      UV_OFFLINE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements_ci_security.txt

      - name: Check Python and pip before installing dependencies
        run: python scripts/check_ci_security.py bootstrap

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes
          --constraint requirements_ci_security.txt
          -r "${{ matrix.requirements }}"

      - name: Check installed test dependency graph
        run: python -m pip check

      - name: Check installed security baseline and offline uv policy
        run: python scripts/check_ci_security.py installed --ha-version "${{ matrix.ha }}"

      - name: Compile Python sources
        run: python -m compileall -q custom_components/meteoswiss tests

      - name: Check bundled translations and versions
        run: python scripts/check_translations.py

      - name: Run regression tests with line and branch coverage
        run: >-
          pytest -q --cov=custom_components.meteoswiss --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json

      - name: Enforce per-module coverage and report the whole integration
        run: python scripts/check_quality_coverage.py >> "$GITHUB_STEP_SUMMARY"

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Keep the repository's GitHub-owned-actions-only policy. The validator
      # is an explicitly pinned tool, with read-only source and no networking.
      - name: Validate custom integration
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --read-only
          --tmpfs /tmp:rw,nosuid,size=256m
          -v "$PWD:/github/workspace:ro"
          ghcr.io/home-assistant/hassfest@sha256:4b1adfb1e0a37710af0390708eb8000230b80b2193ccffbeed0a901fa9765181

  # Preserve the required branch-protection check name while testing both HAs.
  tests:
    if: always()
    needs: [compatibility, hassfest, lockfiles, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both compatibility environments, Hassfest, universal locks and advisories
        env:
          COMPATIBILITY: ${{ needs.compatibility.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          LOCKFILES: ${{ needs.lockfiles.result }}
          ADVISORIES: ${{ needs.advisories.result }}
        run: test "$COMPATIBILITY" = success && test "$HASSFEST" = success && test "$LOCKFILES" = success && test "$ADVISORIES" = success
