name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: HA ${{ matrix.ha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2026.8.3'
            requirements: requirements_test_min.txt
          - ha: '2026.10.1'
            requirements: requirements_test.txt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"

      - name: Compile Python sources
        run: python -m compileall -q custom_components/meteoswiss tests

      - name: Check bundled translations and versions
        run: python scripts/check_translations.py

      - name: Run regression tests with line and branch coverage
        run: >-
          pytest -q --cov=custom_components.meteoswiss --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json

      - name: Enforce flow/pollen coverage and report all modules
        run: python scripts/check_quality_coverage.py >> "$GITHUB_STEP_SUMMARY"

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Keep the repository's GitHub-owned-actions-only policy. The validator
      # is an explicitly pinned tool, with read-only source and no networking.
      - name: Validate custom integration
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --read-only
          --tmpfs /tmp:rw,nosuid,size=256m
          -v "$PWD:/github/workspace:ro"
          ghcr.io/home-assistant/hassfest@sha256:4b1adfb1e0a37710af0390708eb8000230b80b2193ccffbeed0a901fa9765181

  # Preserve the required branch-protection check name while testing both HAs.
  tests:
    if: always()
    needs: [compatibility, hassfest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both compatibility environments and Hassfest
        env:
          COMPATIBILITY: ${{ needs.compatibility.result }}
          HASSFEST: ${{ needs.hassfest.result }}
        run: test "$COMPATIBILITY" = success && test "$HASSFEST" = success
