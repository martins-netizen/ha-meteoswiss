name: CodeQL

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    # Analyze foreign-fork PRs too. Stay on the unprivileged pull_request event;
    # never replace this with pull_request_target to obtain write permissions.
    permissions:
      contents: read # Check out the reviewed merge tree without write access.
      security-events: write # Upload CodeQL results; public-fork PRs are downgraded to read-only.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:python
